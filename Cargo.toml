[package]
name = "model_handler"
version = "0.1.0"
edition = "2024"

[lib]
name = "model_handler"
crate-type = ["cdylib"]

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
llama-cpp-2 = "=0.1.132"
llama-cpp-sys-2 = "=0.1.132"