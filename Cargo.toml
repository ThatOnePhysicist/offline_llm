[package]
name = "model_handler"
version = "0.1.0"
edition = "2024"

[lib]
name = "model_handler"
crate-type = ["cdylib"]

[features]
# On by default so `cargo build --release` produces the Python extension exactly as before.
# `cargo test --no-default-features` links against libpython so the Rust unit tests can run.
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = "0.22"
# Pinned exactly: the chat-template and sampler calls in src/lib.rs match this version's API.
llama-cpp-2 = "=0.1.132"
llama-cpp-sys-2 = "=0.1.132"
